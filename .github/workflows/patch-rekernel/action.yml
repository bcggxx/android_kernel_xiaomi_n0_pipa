name: 'Patch ReKernel for Kernel.'

runs:
  using: 'composite'
  steps:
    - name: Download ReKernel patches
      if: env.REKERNEL_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"
        PATCH_REMOTE="https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/Rekernel"

        mkdir -p "$PATCH_ROOT"
        for f in rekernel_patches.sh rekernel_extra.patch; do
          wget -q --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused \
            -O "$PATCH_ROOT/$f" "$PATCH_REMOTE/$f"
        done

    - name: Patch ReKernel
      if: env.REKERNEL_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_ROOT="${KERNEL_ROOT:-$GITHUB_WORKSPACE}"
        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"

        cd "$KERNEL_ROOT"

        cp "$PATCH_ROOT/rekernel_patches.sh" ./
        bash rekernel_patches.sh

        mkdir -p drivers/rekernel
        cp "$PATCH_ROOT/rekernel_extra.patch" ./
        patch -p1 < rekernel_extra.patch || true

        echo "CONFIG_REKERNEL=y" >> "./arch/${KERNEL_ARCH:-arm64}/configs/${DEFCONFIG_NAME:-pipa_defconfig}"

        echo "[+] Patched Re:Kernel for your kernel successfully."
