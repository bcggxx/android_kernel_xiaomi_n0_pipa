name: 'Patch ReKernel for Kernel.'

runs:
  using: 'composite'
  steps:
    - name: Download ReKernel sources
      if: env.REKERNEL_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"
        # Official non-GKI integration of Re:Kernel (drivers/rekernel + binder
        # and signal hooks), fetched from the upstream repository on every build.
        PATCH_REMOTE="https://raw.githubusercontent.com/Sakion-Team/Re-Kernel/main/Integrate"

        mkdir -p "$PATCH_ROOT/rekernel"
        for f in Kconfig Makefile rekernel.c rekernel.h; do
          wget -q --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused \
            -O "$PATCH_ROOT/rekernel/$f" "$PATCH_REMOTE/rekernel/$f"
        done
        wget -q --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused \
          -O "$PATCH_ROOT/rekernel_patches.sh" "$PATCH_REMOTE/patches.sh"

    - name: Patch ReKernel
      if: env.REKERNEL_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_ROOT="${KERNEL_ROOT:-$GITHUB_WORKSPACE}"
        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"
        KERNEL_ARCH="${KERNEL_ARCH:-arm64}"
        DEFCONFIG_NAME="${DEFCONFIG_NAME:-pipa_defconfig}"

        cd "$KERNEL_ROOT"

        # patches.sh appends CONFIG_REKERNEL* to arch/arm64/configs/defconfig,
        # so retarget it to the defconfig this build actually uses. It also
        # copies the sources from $PATCHDIR/rekernel and injects the hooks into
        # drivers/android/binder.c and kernel/signal.c.
        sed -i "s#arch/arm64/configs/defconfig#arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME#" \
          "$PATCH_ROOT/rekernel_patches.sh"

        bash "$PATCH_ROOT/rekernel_patches.sh"

        grep -q "^CONFIG_REKERNEL=y" "arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME" \
          || { echo "::error::ReKernel patch failed: CONFIG_REKERNEL=y missing from $DEFCONFIG_NAME"; exit 1; }
        grep -q "obj-\$(CONFIG_REKERNEL) += rekernel/" drivers/Makefile \
          || { echo "::error::ReKernel patch failed: drivers/Makefile was not patched"; exit 1; }
        grep -q "rekernel_binder_transaction" drivers/android/binder.c \
          || { echo "::error::ReKernel patch failed: binder.c was not patched"; exit 1; }
        grep -q "rekernel_report" kernel/signal.c \
          || { echo "::error::ReKernel patch failed: signal.c was not patched"; exit 1; }

        echo "[+] Patched Re:Kernel for your kernel successfully."
