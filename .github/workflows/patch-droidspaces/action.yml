name: 'Patch Droidspaces for Kernel.'

runs:
  using: 'composite'
  steps:
    - name: Download Droidspaces patches
      if: env.DROIDSPACES_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"
        PATCH_REMOTE="https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd/raw/refs/heads/mainline/Patches/Droidspaces"

        mkdir -p "$PATCH_ROOT"
        for f in droidspaces.config fix_kernel_panic_in_xt_qtaguid.cocci fix_restore_cgroup_file_prefix_handling.cocci; do
          wget -q --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused \
            -O "$PATCH_ROOT/$f" "$PATCH_REMOTE/$f"
        done

    - name: Patch Droidspaces
      if: env.DROIDSPACES_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_ROOT="${KERNEL_ROOT:-$GITHUB_WORKSPACE}"
        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"

        cd "$KERNEL_ROOT"

        mkdir -p "arch/${KERNEL_ARCH:-arm64}/configs"
        cp "$PATCH_ROOT/droidspaces.config" "./arch/${KERNEL_ARCH:-arm64}/configs/"

        cgroup_patch() {
          cp "$PATCH_ROOT/fix_restore_cgroup_file_prefix_handling.cocci" ./
          spatch --sp-file fix_restore_cgroup_file_prefix_handling.cocci --in-place "kernel/$CGROUP_FILE"
          echo "[+] cgroup.c Patched."
        }

        if [[ "${SUSFS_ENABLE:-false}" == "true" ]]; then
          echo "[-] Detected that SuSFS has been enabled, which may cause Droidspaces to work abnormally."
        fi

        if [[ -f "net/netfilter/xt_qtaguid.c" ]]; then
          cp "$PATCH_ROOT/fix_kernel_panic_in_xt_qtaguid.cocci" ./
          spatch --sp-file fix_kernel_panic_in_xt_qtaguid.cocci --in-place net/netfilter/xt_qtaguid.c
          echo "[+] xt_qtaguid.c Patched."
        else
          echo "[-] Your kernel hasn't xt_qtaguid.c, Skipped."
        fi

        if [[ -f "kernel/cgroup/cgroup.c" ]] && ! grep -q "kernfs_create_link" "kernel/cgroup/cgroup.c" >/dev/null 2>&1; then
          CGROUP_FILE="cgroup/cgroup.c"
          cgroup_patch
        elif [[ -f "kernel/cgroup.c" ]] && ! grep -q "kernfs_create_link" "kernel/cgroup.c" >/dev/null 2>&1; then
          CGROUP_FILE="cgroup.c"
          cgroup_patch
        else
          echo "[-] Detected cgroup.c patched, Skipped."
        fi

        echo "[+] Patched Droidspaces for your kernel successfully."

    - name: Merge Droidspaces config
      if: env.DROIDSPACES_ENABLE == 'true'
      shell: bash
      run: |
        set -euo pipefail

        KERNEL_ROOT="${KERNEL_ROOT:-$GITHUB_WORKSPACE}"
        PATCH_ROOT="${PATCH_ROOT:-$GITHUB_WORKSPACE/.github/workflows}"
        KERNEL_ARCH="${KERNEL_ARCH:-arm64}"
        DEFCONFIG_NAME="${DEFCONFIG_NAME:-pipa_defconfig}"
        DEFCONFIG="arch/$KERNEL_ARCH/configs/$DEFCONFIG_NAME"

        cd "$KERNEL_ROOT"

        if [ ! -f "$DEFCONFIG" ]; then
          echo "::error::Defconfig $DEFCONFIG not found"
          exit 1
        fi

        # The fragment shipped with the patch set lacks CONFIG_USER_NS, which
        # the official Droidspaces non-GKI guide lists as required ("fix for
        # the docker unsafe procfs error").
        grep -q "^CONFIG_USER_NS=y$" "$PATCH_ROOT/droidspaces.config" \
          || echo "CONFIG_USER_NS=y" >> "$PATCH_ROOT/droidspaces.config"

        # Drop previous values of every option so the appended fragment wins,
        # then append the fragment itself (later entries override earlier ones
        # when the defconfig is read, so everything lands in the generated
        # .config at build time).
        while read -r line; do
          case "$line" in
            CONFIG_*=*)
              opt="${line%%=*}"
              sed -i "/^# ${opt} is not set$/d;/^${opt}=/d" "$DEFCONFIG"
              ;;
          esac
        done < "$PATCH_ROOT/droidspaces.config"

        {
          echo ""
          echo "# Droidspaces support"
          cat "$PATCH_ROOT/droidspaces.config"
        } >> "$DEFCONFIG"

        echo "[+] Merged Droidspaces config into $DEFCONFIG."
