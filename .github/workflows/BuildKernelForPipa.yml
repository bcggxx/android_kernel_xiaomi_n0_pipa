name: Build Kernel For Pipa

on:
  workflow_dispatch:
    inputs:
      build_n0_a15:
        description: '编译 n0-A15 分支 / Build n0-A15 branch'
        required: true
        type: boolean
        default: true
      build_n0_a16:
        description: '编译 n0-A16 分支 / Build n0-A16 branch'
        required: true
        type: boolean
        default: true
      build_n0:
        description: '编译 n0 分支（AOSP + HyperOS 两个版本）/ Build n0 branch (both AOSP and HyperOS)'
        required: true
        type: boolean
        default: false
      enable_droidspaces:
        description: '集成 Droidspaces / Integrate Droidspaces'
        required: false
        type: boolean
        default: false
      enable_rekernel:
        description: '集成 ReKernel / Integrate ReKernel'
        required: false
        type: boolean
        default: false
      publish_release:
        description: '发布 Release / Publish Release (需至少选择一个分支 / Requires at least one branch)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      branches: ${{ steps.set-matrix.outputs.branches }}
      should_release: ${{ steps.set-matrix.outputs.should_release }}
      rekernel: ${{ steps.set-matrix.outputs.rekernel }}
      droidspaces: ${{ steps.set-matrix.outputs.droidspaces }}
    steps:
      - id: set-matrix
        run: |
          MATRIX="[]"
          if [ "${{ github.event.inputs.build_n0_a15 }}" == "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"branch": "n0-A15", "target": "aosp"}]')
          fi
          if [ "${{ github.event.inputs.build_n0_a16 }}" == "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"branch": "n0-A16", "target": "aosp"}]')
          fi
          if [ "${{ github.event.inputs.build_n0 }}" == "true" ]; then
            MATRIX=$(echo "$MATRIX" | jq -c '. + [{"branch": "n0", "target": "aosp"}, {"branch": "n0", "target": "miui"}]')
          fi
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "branches=$(echo "$MATRIX" | jq -r '[.[].branch] | unique | join(", ")')" >> $GITHUB_OUTPUT
          echo "rekernel=${{ github.event.inputs.enable_rekernel || 'false' }}" >> $GITHUB_OUTPUT
          echo "droidspaces=${{ github.event.inputs.enable_droidspaces || 'false' }}" >> $GITHUB_OUTPUT

          if [ "${{ github.event.inputs.publish_release }}" == "true" ] && [ "$MATRIX" != "[]" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate inputs
        run: |
          if [ "${{ steps.set-matrix.outputs.matrix }}" == "[]" ]; then
            echo "::error::至少选择一个分支进行编译 / At least one branch must be selected"
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: workflow-src

      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          path: build-src

      - name: Set branch environment variable
        run: |
          echo "BRANCH=${{ matrix.branch }}" >> $GITHUB_ENV
          echo "KERNEL_ROOT=${{ github.workspace }}/build-src" >> "$GITHUB_ENV"
          echo "PATCH_ROOT=${{ github.workspace }}/workflow-src/.github/workflows" >> "$GITHUB_ENV"

      - name: Record build start time
        id: build_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install nano vim wget curl git ccache \
          automake flex lzop bison gperf build-essential zip \
          curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
          libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools \
          pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen libswitch-perl policycoreutils \
          minicom libxml-sax-base-perl libxml-simple-perl bc \
          libc6-dev-i386 lib32ncurses-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev xsltproc unzip device-tree-compiler \
          cpio p7zip p7zip-full libtinfo6 -y

          sudo apt install python3 python-is-python3 -y

      - name: Install AOSP-Clang
        run: |
          mkdir -p ${{ github.workspace }}/clang
          wget -c --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz"
          tar -xzf clang.tar.gz -C ${{ github.workspace }}/clang
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Install coccinelle for Droidspaces patch
        if: ${{ github.event.inputs.enable_droidspaces == 'true' }}
        run: |
          sudo apt update
          sudo apt install -y coccinelle

      - name: Grant execute permission for build.sh
        working-directory: build-src
        run: chmod +x build.sh

      - name: Setup patch options
        run: |
          echo "DROIDSPACES_ENABLE=${{ github.event.inputs.enable_droidspaces || 'false' }}" >> "$GITHUB_ENV"
          echo "REKERNEL_ENABLE=${{ github.event.inputs.enable_rekernel || 'false' }}" >> "$GITHUB_ENV"
          echo "KERNEL_ARCH=arm64" >> "$GITHUB_ENV"
          if [ "${{ matrix.branch }}" == "n0" ] && [ "${{ matrix.target }}" == "miui" ]; then
            echo "DEFCONFIG_NAME=pipa_miui_defconfig" >> "$GITHUB_ENV"
          else
            echo "DEFCONFIG_NAME=pipa_defconfig" >> "$GITHUB_ENV"
          fi
          echo "SUSFS_ENABLE=false" >> "$GITHUB_ENV"

      - name: Apply Droidspaces patch
        if: ${{ github.event.inputs.enable_droidspaces == 'true' }}
        uses: ./workflow-src/.github/workflows/patch-droidspaces

      - name: Apply ReKernel patch
        if: ${{ github.event.inputs.enable_rekernel == 'true' }}
        uses: ./workflow-src/.github/workflows/patch-rekernel

      - name: Build Kernel
        working-directory: build-src
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: ./build.sh "${BUILD_TARGET}"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-Pipa-${{ matrix.branch }}-${{ matrix.target }}-${{ github.run_number }}
          path: build-src/*.zip
          if-no-files-found: error

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-error-log-${{ matrix.branch }}-${{ matrix.target }}
          path: build-src/error.log

      - name: Send Telegram notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END=$(date +%s)
          START="${{ steps.build_start.outputs.start }}"
          DURATION=$((END - ${START:-END}))
          HOURS=$((DURATION / 3600))
          MINS=$(((DURATION % 3600) / 60))
          SECS=$((DURATION % 60))
          DURATION_FMT=$(printf "%02d:%02d:%02d" $HOURS $MINS $SECS)

          REPO="${{ github.repository }}"
          REPO_URL="https://github.com/${REPO}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          BRANCH="${{ matrix.branch }}"
          RUN_NUMBER="${{ github.run_number }}"

          COMMIT_MSG=$(git -C workflow-src log -1 --pretty=format:'%s' "${COMMIT_SHA}" 2>/dev/null | head -c 120)
          [ -z "$COMMIT_MSG" ] && COMMIT_MSG="(no message)"

          if [ "${{ job.status }}" == "success" ]; then
            STATUS="🟢 Build Success"
          else
            STATUS="🔴 Build Failed"
          fi

          printf -v MESSAGE '%s\nRepository: <a href="%s">%s</a>\nBranch: %s\nTarget: %s\nDuration: %s\nActions: <a href="%s">#%s</a>\nCommit: <a href="%s">%s</a> %s' \
            "$STATUS" "$REPO_URL" "$REPO" "$BRANCH" "${{ matrix.target }}" "$DURATION_FMT" "$RUN_URL" "$RUN_NUMBER" "$COMMIT_URL" "$SHORT_SHA" "$COMMIT_MSG"

          if [ "${{ job.status }}" == "success" ]; then
            ZIP_FILE=$(ls build-src/*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F parse_mode=HTML \
                -F caption="${MESSAGE}" \
                -F "document=@${ZIP_FILE}"
            else
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode parse_mode=HTML \
                --data-urlencode text="${MESSAGE}"
            fi
          else
            if [ -f build-src/error.log ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F parse_mode=HTML \
                -F caption="${MESSAGE}" \
                -F "document=@build-src/error.log"
            else
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode parse_mode=HTML \
                --data-urlencode text="${MESSAGE}"
            fi
          fi

  release:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release notes
        env:
          REKERNEL_ENABLED: ${{ needs.prepare.outputs.rekernel }}
          DROIDSPACES_ENABLED: ${{ needs.prepare.outputs.droidspaces }}
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          WORKFLOW_URL="$REPO_URL/actions/workflows/BuildKernelForPipa.yml"
          README_URL="$REPO_URL/blob/${{ github.ref_name }}/README.md"
          README_EN_URL="$REPO_URL/blob/${{ github.ref_name }}/README.en.md"

          {
            echo "## 🚀 自动构建的内核包 / Auto-built Kernel Zips"
            echo
            echo "本仓库内核源码保持纯净，以下产物均为 **无 Root** 版本。"
            echo
            echo "These builds come from a **clean kernel source without Root**."
            echo
            echo "| 项目 / Item | 内容 / Details |"
            echo "| :--- | :--- |"
            echo "| 🌿 分支 / Branches | \`${{ needs.prepare.outputs.branches }}\` |"
            echo "| 🔢 构建编号 / Build | #${{ github.run_number }} |"
            echo "| 🧩 产物 / Artifacts | zip 刷机包（见 Assets）/ Flashable zips (see Assets) |"
            echo
            echo "### 🧱 集成状态 / Integration Status"
            echo
            echo "| 组件 / Component | 状态 / Status |"
            echo "| :--- | :--- |"
            if [ "$REKERNEL_ENABLED" == "true" ]; then
              echo "| 🪦 ReKernel（墓碑 / tombstone） | ✅ 已集成 / Included |"
            else
              echo "| 🪦 ReKernel（墓碑 / tombstone） | ❌ 未集成 / Not included |"
            fi
            if [ "$DROIDSPACES_ENABLED" == "true" ]; then
              echo "| 📦 Droidspaces（容器 / containers） | ✅ 已集成 / Included |"
            else
              echo "| 📦 Droidspaces（容器 / containers） | ❌ 未集成 / Not included |"
            fi
            echo
            echo "### 📖 使用指引 / Usage Guide"
            echo
            if [ "$REKERNEL_ENABLED" == "true" ]; then
              echo "**🪦 ReKernel：已集成 / Included**"
              echo
              echo "- 想用：先在 **NoActive 等软件的高级设置** 中将 NetLink 手动设为 \`22\`，否则不会生效；详见 [README「ReKernel 使用说明」]($README_URL) / [EN]($README_EN_URL)。"
              echo "- 不想用：无需任何操作，可直接忽略。"
              echo "- Want it: set NetLink to \`22\` in **NoActive**-like apps, otherwise it will not work; see the [README]($README_EN_URL)."
              echo "- Not needed: nothing to do, just ignore it."
            else
              echo "**🪦 ReKernel：未集成 / Not included**"
              echo
              echo "- 想用：重新运行 [Build Kernel For Pipa]($WORKFLOW_URL) 并勾选 \`enable_rekernel\` 后重新构建；详见 [README「ReKernel 使用说明」]($README_URL) / [EN]($README_EN_URL)。"
              echo "- 不想用：无需任何操作。"
              echo "- Want it: re-run [Build Kernel For Pipa]($WORKFLOW_URL) with \`enable_rekernel\` checked; see the [README]($README_EN_URL)."
              echo "- Not needed: nothing to do."
            fi
            echo
            if [ "$DROIDSPACES_ENABLED" == "true" ]; then
              echo "**📦 Droidspaces：已集成 / Included**"
              echo
              echo "- 想用：容器支持已内置，可直接使用；详见 [README「Build Kernel For Pipa 工作流选项说明」]($README_URL) / [EN]($README_EN_URL)。"
              echo "- 不想用：无需任何操作，可直接忽略。"
              echo "- Want it: container support is ready to use; see the [README]($README_EN_URL)."
              echo "- Not needed: nothing to do, just ignore it."
            else
              echo "**📦 Droidspaces：未集成 / Not included**"
              echo
              echo "- 想用：重新运行 [Build Kernel For Pipa]($WORKFLOW_URL) 并勾选 \`enable_droidspaces\` 后重新构建；详见 [README「Build Kernel For Pipa 工作流选项说明」]($README_URL) / [EN]($README_EN_URL)。"
              echo "- 不想用：无需任何操作。"
              echo "- Want it: re-run [Build Kernel For Pipa]($WORKFLOW_URL) with \`enable_droidspaces\` checked; see the [README]($README_EN_URL)."
              echo "- Not needed: nothing to do."
            fi
            echo
            echo "### 📥 刷机包列表 / Flashable Zips"
            echo
            find artifacts -name '*.zip' -printf '- `%f`\n' | sort
            echo
            echo "---"
            echo
            echo "> 🤖 由 GitHub Actions 自动构建 / Automatically built by GitHub Actions"
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Pipa-${{ github.run_number }}
          name: "Kernel Pipa #${{ github.run_number }}"
          body_path: release-notes.md
          files: artifacts/**/*.zip
          prerelease: true
