name: Build Kernel For Pipa

on:
  workflow_dispatch:
    inputs:
      build_n0_a15:
        description: '编译 n0-A15 分支 / Build n0-A15 branch'
        required: true
        type: boolean
        default: true
      build_n0_a16:
        description: '编译 n0-A16 分支 / Build n0-A16 branch'
        required: true
        type: boolean
        default: true
      enable_droidspaces:
        description: '集成 Droidspaces / Integrate Droidspaces'
        required: false
        type: boolean
        default: false
      enable_rekernel:
        description: '集成 ReKernel / Integrate ReKernel'
        required: false
        type: boolean
        default: false
      publish_release:
        description: '发布 Release / Publish Release (需同时编译两个分支 / Requires both branches to be built)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.set-matrix.outputs.branches }}
      should_release: ${{ steps.set-matrix.outputs.should_release }}
    steps:
      - id: set-matrix
        run: |
          BRANCHES="[]"
          if [ "${{ github.event.inputs.build_n0_a15 }}" == "true" ]; then
            BRANCHES=$(echo "$BRANCHES" | jq -c '. + ["n0-A15"]')
          fi
          if [ "${{ github.event.inputs.build_n0_a16 }}" == "true" ]; then
            BRANCHES=$(echo "$BRANCHES" | jq -c '. + ["n0-A16"]')
          fi
          echo "branches=$BRANCHES" >> $GITHUB_OUTPUT

          if [ "${{ github.event.inputs.publish_release }}" == "true" ] && \
             [ "${{ github.event.inputs.build_n0_a15 }}" == "true" ] && \
             [ "${{ github.event.inputs.build_n0_a16 }}" == "true" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate inputs
        run: |
          if [ "${{ steps.set-matrix.outputs.branches }}" == "[]" ]; then
            echo "::error::至少选择一个分支进行编译 / At least one branch must be selected"
            exit 1
          fi
          if [ "${{ github.event.inputs.publish_release }}" == "true" ]; then
            if [ "${{ github.event.inputs.build_n0_a15 }}" != "true" ] || \
               [ "${{ github.event.inputs.build_n0_a16 }}" != "true" ]; then
              echo "::error::发布 Release 需要同时编译两个分支 / Publishing release requires both branches to be built"
              exit 1
            fi
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ${{ fromJson(needs.prepare.outputs.branches) }}
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          path: workflow-src

      - name: Checkout build branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          path: build-src

      - name: Set branch environment variable
        run: |
          echo "BRANCH=${{ matrix.branch }}" >> $GITHUB_ENV
          echo "KERNEL_ROOT=${{ github.workspace }}/build-src" >> "$GITHUB_ENV"
          echo "PATCH_ROOT=${{ github.workspace }}/workflow-src/.github/workflows" >> "$GITHUB_ENV"

      - name: Record build start time
        id: build_start
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install nano vim wget curl git ccache \
          automake flex lzop bison gperf build-essential zip \
          curl zlib1g-dev g++-multilib libxml2-utils bzip2 \
          libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools \
          pngcrush schedtool dpkg-dev liblz4-tool make optipng \
          maven libssl-dev pwgen libswitch-perl policycoreutils \
          minicom libxml-sax-base-perl libxml-simple-perl bc \
          libc6-dev-i386 lib32ncurses-dev libx11-dev lib32z-dev \
          libgl1-mesa-dev xsltproc unzip device-tree-compiler \
          cpio p7zip p7zip-full libtinfo6 -y

          sudo apt install python3 python-is-python3 -y

      - name: Install AOSP-Clang
        run: |
          mkdir -p ${{ github.workspace }}/clang
          wget -c --tries=10 --waitretry=5 --retry-on-host-error --retry-connrefused -O clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz"
          tar -xzf clang.tar.gz -C ${{ github.workspace }}/clang
          echo "${{ github.workspace }}/clang/bin" >> $GITHUB_PATH

      - name: Install coccinelle for Droidspaces patch
        if: ${{ github.event.inputs.enable_droidspaces == 'true' }}
        run: |
          sudo apt update
          sudo apt install -y coccinelle

      - name: Grant execute permission for build.sh
        working-directory: build-src
        run: chmod +x build.sh

      - name: Setup patch options
        run: |
          echo "DROIDSPACES_ENABLE=${{ github.event.inputs.enable_droidspaces || 'false' }}" >> "$GITHUB_ENV"
          echo "REKERNEL_ENABLE=${{ github.event.inputs.enable_rekernel || 'false' }}" >> "$GITHUB_ENV"
          echo "KERNEL_ARCH=arm64" >> "$GITHUB_ENV"
          echo "DEFCONFIG_NAME=pipa_defconfig" >> "$GITHUB_ENV"
          echo "SUSFS_ENABLE=false" >> "$GITHUB_ENV"

      - name: Apply Droidspaces patch
        if: ${{ github.event.inputs.enable_droidspaces == 'true' }}
        uses: ./workflow-src/.github/workflows/patch-droidspaces

      - name: Apply ReKernel patch
        if: ${{ github.event.inputs.enable_rekernel == 'true' }}
        uses: ./workflow-src/.github/workflows/patch-rekernel

      - name: Build Kernel
        working-directory: build-src
        run: ./build.sh

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v7
        with:
          name: Kernel-Pipa-${{ matrix.branch }}-${{ github.run_number }}
          path: build-src/*.zip
          if-no-files-found: error

      - name: Upload Error Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-error-log-${{ matrix.branch }}
          path: build-src/error.log

      - name: Send Telegram notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          END=$(date +%s)
          START="${{ steps.build_start.outputs.start }}"
          DURATION=$((END - ${START:-END}))
          HOURS=$((DURATION / 3600))
          MINS=$(((DURATION % 3600) / 60))
          SECS=$((DURATION % 60))
          DURATION_FMT=$(printf "%02d:%02d:%02d" $HOURS $MINS $SECS)

          REPO="${{ github.repository }}"
          REPO_URL="https://github.com/${REPO}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_URL="https://github.com/${REPO}/commit/${COMMIT_SHA}"
          BRANCH="${{ matrix.branch }}"
          RUN_NUMBER="${{ github.run_number }}"

          COMMIT_MSG=$(git -C workflow-src log -1 --pretty=format:'%s' "${COMMIT_SHA}" 2>/dev/null | head -c 120)
          [ -z "$COMMIT_MSG" ] && COMMIT_MSG="(no message)"

          if [ "${{ job.status }}" == "success" ]; then
            STATUS="🟢 Build Success"
          else
            STATUS="🔴 Build Failed"
          fi

          printf -v MESSAGE '%s\nRepository: <a href="%s">%s</a>\nBranch: %s\nDuration: %s\nActions: <a href="%s">#%s</a>\nCommit: <a href="%s">%s</a> %s' \
            "$STATUS" "$REPO_URL" "$REPO" "$BRANCH" "$DURATION_FMT" "$RUN_URL" "$RUN_NUMBER" "$COMMIT_URL" "$SHORT_SHA" "$COMMIT_MSG"

          if [ "${{ job.status }}" == "success" ]; then
            ZIP_FILE=$(ls build-src/*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode parse_mode=HTML \
                --data-urlencode caption="${MESSAGE}" \
                -F "document=@${ZIP_FILE}"
            else
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
                --data-urlencode parse_mode=HTML \
                --data-urlencode text="${MESSAGE}"
            fi
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode parse_mode=HTML \
              --data-urlencode text="${MESSAGE}"
          fi

  release:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Pipa-${{ github.run_number }}
          name: Kernel Pipa #${{ github.run_number }}
          body: |
            自动构建的内核包 / Auto-built kernel zips

            分支/Branches: n0-A15, n0-A16
            构建编号/Build: #${{ github.run_number }}
            No Root/无Root
          files: artifacts/**/*.zip
          prerelease: true
